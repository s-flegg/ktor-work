<body>
<form action="https://httpbin.io/dump/request" method="POST">
    <p>
    <label for="name">Enter your name: </label>
    <input type="text" id="name" name="name">
    </p>
    <p>
    <label for="email">Enter your email: </label>
    <input type="email" id="email" name="email">
    </p>
    <p>
    <label for="dob">Select your date of birth: </label>
    <input type="date" id="dob" name="dob">
    <br>
    <label for="colour">Please choose your favourite colour: </label>
    <input type="color" id="colour" name="colour">
    </p>
    <p>
    Please select one from below
    <ul>
        <li>
            <label for="student">Student </label>
            <input type="radio" id="student" name="studentOrStaff" value="student">
        </li>
        <li>
            <label for="staffQuestion">Staff </label>
            <input type="radio" id="staffQuestion" name="studentOrStaff" value="staff">
        </li>
    </ul>
    </p>
    <p>
    <input type="submit" value="Submit">
    </p>

</form>
